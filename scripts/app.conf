# App-specific configuration for the release pipeline.
# Both release.sh and ios-appstore.sh source this file.

# -- Identity -----------------------------------------------------------------
APP_NAME=PearCircle                          # Display name (used in logs, Nostr posts)
BUNDLE_ID=com.pearcircle                     # iOS bundle ID and Android package name
ARTIFACT_PREFIX=pearcircle                   # Prefix for APK/AAB filenames (e.g. pearcircle-v0.1.0.apk)

# -- iOS / Xcode --------------------------------------------------------------
XCODE_WORKSPACE=ios/PearCircle.xcworkspace
XCODE_SCHEME=PearCircle
XCODE_PROJECT=ios/PearCircle.xcodeproj/project.pbxproj
IOS_PROVISIONING_PROFILE="PearCircle Distribution"

# -- Android signing -----------------------------------------------------------
KEY_ALIAS_DEFAULT=pearcircle

# -- Mac Mini build host -------------------------------------------------------
MAC_MINI_REPO_PATH="peerloomllc/pearcircle"

# -- Nostr announcement --------------------------------------------------------
APP_TAGLINE="A peer-to-peer location-sharing app"
APP_WEBSITE=https://peerloomllc.com/pearcircle/
NOSTR_HASHTAGS="#pearcircle #p2p #family #privacy #bitcoin #zapstore"

# -- Screenshot automation ----------------------------------------------------
# iOS: space-separated "DeviceName|UDID" pairs (see `xcrun simctl list devices`
# on the Mac Mini). iPhone 17 Pro Max is the 6.9" App Store required size.
IOS_SCREENSHOT_DEVICES="iPhone-17-Pro-Max|BB87E9B2-1A75-4118-B03E-9FBADD5A97F4"

# Android: debug APKs get a .debug applicationId suffix; activity keeps namespace.
ANDROID_APP_ID="com.pearcircle.debug"
ANDROID_MAIN_ACTIVITY="com.pearcircle.debug/com.pearcircle.MainActivity"
# Space-separated AVD names (see `emulator -list-avds`).
ANDROID_SCREENSHOT_AVDS="Pixel_9_Pro"
