version: "3.7"

services:
  # Umbrel's reverse proxy: gates the UI behind the Umbrel login and forwards
  # to the seeder container on the app network. APP_HOST is "<app-id>_app_1".
  app_proxy:
    environment:
      APP_HOST: pearcircle-seeder_app_1
      APP_PORT: 8730

  app:
    # Replace with the published multi-arch image once it's pushed. For local
    # testing this tag must already be `docker load`ed on the Umbrel host.
    image: ghcr.io/peerloomllc/pearcircle-seeder:0.1.0
    restart: on-failure
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    environment:
      SEEDER_HOST: 0.0.0.0
      SEEDER_PORT: "8730"
      SEEDER_NO_AUTH: "1"
    volumes:
      # Seeder identity, per-circle enrollments, retention state, logs.
      - ${APP_DATA_DIR}/data:/data
