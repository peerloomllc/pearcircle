# PearCircle blind-seeder packaged as a StartOS (Start9) service.
#
# Targets StartOS 0.3.5.x (the stable channel; the packaging model here is
# manifest.yaml + a Docker image tar + deno-bundled TS procedures, packed with
# `start-sdk pack`). The newer 0.4.x TypeScript SDK is a separate follow-up.

# Unique package identifier. Community-registry apps do NOT require a store
# prefix the way Umbrel does, so this is just the app id.
id: pearcircle-seeder
title: "PearCircle Seeder"
# emver: up to four dot-separated numbers; the fourth (if present) is the
# StartOS packaging revision. Kept in lockstep with the seeder image tag.
version: 1.1.2
release-notes: "New Features\n  \n    - **Smaller Places.** Places can now be as small as 50 meters, down from 150. Handy when two Places sit close together, like neighbors or a school next to a park. When you pick a size under 150 meters, the app shows a short warning: a small Place can miss arrivals or report someone leaving when they have not, especially indoors, and iPhones running in the background still notice arrivals and departures at 150 meters.\n    - **See what your seeder is holding.** The seeder dashboard now shows, for each circle, whose latest location it is keeping for them while their phone is offline. A line turns amber when someone is missing, and a details list shows when each person's location was last stored.\n\nImprovements\n\n    - **Repairs finish on their own.** If a circle repair has to wait, the app now keeps retrying every few seconds while it is open, instead of asking you to close and reopen it.\n    - **Open the seeder dashboard from another computer.** Mac and Windows seeders can now be reached from other devices on your home network, with step-by-step instructions in the install guides. The setting stays in place when the seeder updates.\n    - **Start9 updates show up.** Seeders installed from the Start9 store on newer Start9 systems now see new versions as they are released.\n\nBug Fixes\n\n    - **Mac seeder keeps running after you log out.** It used to stop when you logged out of your Mac, which defeated the point of a seeder. It now keeps going with nobody logged in.\n    - **Mac seeder starts after a reinstall.** Fixed a case where reinstalling left the seeder quietly switched off.\n    - **Seeder survives a Start9 system upgrade.** Upgrading a Start9 box could leave the seeder stuck restarting over and over. It now recovers on its own.\n    - **Working dashboard link for network installs.** A seeder set up to be reachable from other computers now shows a link you can actually open, with its access code included.\n"
license: MIT
wrapper-repo: "https://github.com/peerloomllc/pearcircle"
upstream-repo: "https://github.com/peerloomllc/pearcircle"
support-site: "https://github.com/peerloomllc/pearcircle/issues"
marketing-site: "https://peerloomllc.com"
# Support Development card lives on the website's About page.
donation-url: "https://peerloomllc.com/about"
build: ["make"]
description:
  short: Keep your PearCircle circles online 24/7.
  long: |
    Run a blind seeder for your PearCircle circles on your Start9 server so their
    history stays in sync even when every phone is offline.

    PearCircle is a peer-to-peer location-sharing app with no accounts and no
    servers: a circle's data lives only on its members' devices and syncs
    directly between them, so a circle is only reachable while at least one
    member's phone is online. This service runs the PearCircle seed-mode worklet
    as an always-on background process that replicates each enrolled circle's
    encrypted blocks, keeping members caught up regardless of who is online.

    It is a "blind" seeder: the blocks it stores and serves stay encrypted, so
    your server keeps a circle's data available without ever being able to read
    the locations, places, or members inside it. Circle members stay in control:
    they admit the seeder when it enrolls and can revoke it at any time, and each
    circle has its own retention window (forever, 30 days, 7 days, or 24 hours).

    To enroll a circle: open the seeder dashboard, then in the PearCircle phone
    app mint a seed invite for the circle and paste it in.
assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md
# The seed worklet is a long-running process. StartOS keeps the main container
# alive for the lifetime of the service.
main:
  type: docker
  image: main
  entrypoint: "docker_entrypoint.sh"
  args: []
  mounts:
    # Persistence volume. The seeder writes its identity, per-circle
    # enrollments, retention state, Hyperbee store, and logs under here; the
    # entrypoint points --data-dir at <mount>/data.
    main: /root
  gpu-acceleration: false
# The pinned base image is a multi-arch manifest list (amd64 + arm64), so both
# a typical x86 Start9 server and an arm one (Raspberry Pi) are supported.
hardware-requirements:
  arch:
    - x86_64
    - aarch64
# HTTP GET against the dashboard proves the worklet host is up and serving.
health-checks:
  web-ui:
    name: Web Interface
    success-message: The seeder dashboard is reachable
    type: script
# No user-facing configuration for v1: the seeder is enrolled from the phone
# app, not via a config form.
config: ~
# Populated at runtime: the entrypoint writes /root/start9/stats.yaml (compat
# format) so Properties shows the seeder public key, nickname and enrollment
# counts. Without that file this page renders empty.
#
# MUST be the object form. `properties: ~` serialises to an empty value and
# StartOS reads that as "this package has no properties procedure", so it never
# invokes properties.ts however correct stats.yaml is. That was the root cause
# of PearCal's three failed attempts at this page (pearcal-native PR #249).
properties:
  type: script
volumes:
  main:
    type: data
# Dashboard interface. StartOS terminates TLS and gates access behind the
# server; the in-app bearer token is disabled (SEEDER_NO_AUTH in the
# entrypoint) exactly as it is behind Umbrel's app_proxy.
interfaces:
  main:
    name: Seeder Dashboard
    description: Enroll circles and watch replication status.
    tor-config:
      port-mapping:
        80: "8730"
    lan-config:
      443:
        ssl: true
        internal: 8730
    ui: true
    protocols:
      - tcp
      - http
dependencies: {}
# Encrypted backups of the seeder state via the StartOS-provided duplicity
# image. Backs up <mount>/data (identity + enrollments + retention state).
backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /root/data
    mounts:
      BACKUP: "/mnt/backup"
      main: "/root/data"
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /root/data
    mounts:
      BACKUP: "/mnt/backup"
      main: "/root/data"
migrations:
  from:
    "*":
      type: script
      args: ["from"]
  to:
    "*":
      type: script
      args: ["to"]
