version: "3.7"

services:
  # Umbrel's reverse proxy: gates the UI behind the Umbrel login and forwards
  # to the seeder container on the app network. APP_HOST is "<app-id>_app_1",
  # and the app id carries the PeerLoom community-store prefix (Umbrel requires
  # every app's id to start with the store id; store id = "peerloom").
  app_proxy:
    environment:
      APP_HOST: peerloom-pearcircle-seeder_app_1
      APP_PORT: 8730

  app:
    # Published, public, pinned by digest (amd64). Multi-arch (arm64 for a
    # Raspberry Pi) is a follow-up.
    image: ghcr.io/peerloomllc/pearcircle-seeder:0.1.4@sha256:a7b8f131e24606b6a15226a75a413137cb0205c9db7036a859e344da008dea26
    restart: on-failure
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    environment:
      SEEDER_HOST: 0.0.0.0
      SEEDER_PORT: "8730"
      SEEDER_NO_AUTH: "1"
    volumes:
      # Seeder identity, per-circle enrollments, retention state, logs.
      - ${APP_DATA_DIR}/data:/data
