releaseNotes: |
  Improvements
                                                                                                                                                         
    - PearCircle uses much less battery on Android. GPS now turns on only while you're moving, while the app is open or while a trip is being recorded. The rest of the time the app uses wifi and cell towers to find you.
    - Arrive and leave alerts for your Places keep working while GPS is off.

  Bug Fixes

    - Fixed a bug on Android that stopped your phone from going to sleep after it restarted, which drained the battery.
