releaseNotes: |
  New Features
    
      - **Smaller Places.** Places can now be as small as 50 meters, down from 150. Handy when two Places sit close together, like neighbors or a school next to a park. When you pick a size under 150 meters, the app shows a short warning: a small Place can miss arrivals or report someone leaving when they have not, especially indoors, and iPhones running in the background still notice arrivals and departures at 150 meters.
      - **See what your seeder is holding.** The seeder dashboard now shows, for each circle, whose latest location it is keeping for them while their phone is offline. A line turns amber when someone is missing, and a details list shows when each person's location was last stored.

  Improvements

      - **Repairs finish on their own.** If a circle repair has to wait, the app now keeps retrying every few seconds while it is open, instead of asking you to close and reopen it.
      - **Open the seeder dashboard from another computer.** Mac and Windows seeders can now be reached from other devices on your home network, with step-by-step instructions in the install guides. The setting stays in place when the seeder updates.
      - **Start9 updates show up.** Seeders installed from the Start9 store on newer Start9 systems now see new versions as they are released.

  Bug Fixes

      - **Mac seeder keeps running after you log out.** It used to stop when you logged out of your Mac, which defeated the point of a seeder. It now keeps going with nobody logged in.
      - **Mac seeder starts after a reinstall.** Fixed a case where reinstalling left the seeder quietly switched off.
      - **Seeder survives a Start9 system upgrade.** Upgrading a Start9 box could leave the seeder stuck restarting over and over. It now recovers on its own.
      - **Working dashboard link for network installs.** A seeder set up to be reachable from other computers now shows a link you can actually open, with its access code included.
